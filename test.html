<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード検証ツール</title>
    <style>
        /* 全体のスタイル設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* ヘッダー */
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        /* メインコンテンツ */
        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        /* 設定エリア */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #495057;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #f5576c;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        /* トークン検証結果 */
        .result-area {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #dee2e6;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .result-label {
            font-weight: bold;
            color: #495057;
            margin-bottom: 5px;
        }

        .result-value {
            color: #212529;
            word-break: break-all;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .status.valid {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.invalid {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.expired {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        /* URLパラメータ表示 */
        .url-info {
            padding: 15px;
            background: #e7f3ff;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #004085;
            word-break: break-all;
        }

        /* レスポンシブ対応 */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
            }
            
            body {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1>🔍 QRコード検証ツール</h1>
            <p>トークンの妥当性を確認</p>
        </div>

        <div class="content">
            <!-- URL情報 -->
            <div id="urlInfo" class="url-info" style="display: none;">
                <strong>📌 URLパラメータ:</strong><br>
                <span id="urlParam"></span>
            </div>

            <!-- 設定エリア -->
            <div class="section">
                <h2>⚙️ パスコード設定</h2>
                <div class="form-group">
                    <label for="testPasscode">パスコード</label>
                    <input type="password" id="testPasscode" placeholder="検証用パスコードを入力">
                </div>
                <button id="savePasscodeBtn">💾 パスコードを保存</button>
            </div>

            <!-- 検証結果エリア -->
            <div class="section">
                <h2>📊 検証結果</h2>
                <div id="validationResult" class="result-area">
                    <p style="color: #666; text-align: center;">URLにトークンが含まれていません</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="test.js"></script>
</body>
</html>
